name: Refresh Rocket cue pages and feed

on:
  workflow_dispatch:
  schedule:
    # Off the hour; a second chance follows each missed run. The committed
    # budget reservation prevents more than one ten-request LL2 attempt per 65 minutes.
    - cron: '13,28,43,58 * * * *'

permissions: {}

concurrency:
  group: rocket-cue-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Only to reserve LL2 request budget before fetching.
    outputs:
      updated: ${{ steps.refresh.outputs.updated }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true # Required for the budget-state push below.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify cache contract
        run: npm test
      - name: Check and reserve upstream request budget
        id: reserve
        run: node scripts/reserve-budget.mjs
      - name: Persist reservation before any LL2 call
        if: steps.reserve.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/last-attempt.json
          git commit -m 'Reserve LL2 refresh budget'
          git push
      - name: Build complete site and cache
        if: steps.reserve.outputs.due == 'true'
        id: refresh
        run: node scripts/build-site.mjs
      - name: Configure Pages
        if: steps.refresh.outputs.updated == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload complete Pages artifact
        if: steps.refresh.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.updated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
